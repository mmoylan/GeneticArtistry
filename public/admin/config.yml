# Sveltia CMS configuration
# Sign in at /admin. GitHub login goes through the Cloudflare Worker in /oauth-worker.
# (Alternative: choose "Sign in with token" on the login screen and paste a GitHub PAT.)
backend:
  name: github
  repo: mmoylan/GeneticArtistry
  branch: main
  base_url: https://ga-cms-auth.geneticartistryllc.workers.dev
  auth_endpoint: auth

media_folder: public/uploads
public_folder: /uploads

site_url: https://geneticartistry.com
display_url: https://geneticartistry.com

collections:
  # ---------------------------------------------------------------------------------------------
  # PAGES: each page is an ordered list of blocks. Add, remove and drag blocks to rearrange them.
  # Every block has an "Animation" group (entrance effect, speed, delay, headline/item motion),
  # a spacing option and an optional anchor name for links like /#contact.
  # The page called "home" is the home page; any other page appears at /<slug>.
  # ---------------------------------------------------------------------------------------------
  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    format: json
    extension: json
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Page Title, widget: string }
      - { name: description, label: Description (search results), widget: text, required: false }
      - { name: backdrop, label: Background leaf, widget: select, default: subtle, hint: "A huge, faint leaf fixed behind the whole page that drifts as you scroll. Switched off automatically for visitors who ask for high contrast.", options: [{ label: "Subtle (recommended)", value: subtle }, { label: Medium, value: medium }, { label: None, value: none }] }
      - { name: backdrop_position, label: Background leaf position, widget: select, default: left, hint: "The leaf is 200% of the screen width; 40% of it sits off this edge.", options: [{ label: "Left edge (40% off-screen)", value: left }, { label: "Right edge (40% off-screen)", value: right }, { label: "Centre of the page", value: center }] }
      - label: Sections
        name: sections
        widget: list
        typeKey: type
        hint: "Add blocks, drag to reorder, delete the ones you don't want."
        types:
          - label: Hero
            name: hero
            widget: object
            summary: "Hero: {{title}}"
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: title, label: Title, widget: string, hint: "Wrap a word in <em>…</em> for the italic accent." }
              - { name: lede, label: Intro, widget: text, required: false }
              - { name: primary_label, label: Main button text, widget: string, required: false }
              - { name: primary_link, label: Main button link, widget: string, required: false, hint: "e.g. #collection or /insights" }
              - { name: secondary_label, label: Second button text, widget: string, required: false }
              - { name: secondary_link, label: Second button link, widget: string, required: false }
              - { name: leaf, label: Background leaf, widget: select, default: draw, options: [{ label: "Draws itself in", value: draw }, { label: "Still (no drawing)", value: static }, { label: "No leaf", value: none }] }
              - { name: leaf_strength, label: Leaf visibility, widget: select, default: subtle, options: [{ label: Subtle, value: subtle }, { label: Medium, value: medium }, { label: Bold, value: bold }] }
              - &spacing { name: spacing, label: Space above and below, widget: select, default: normal, options: [{ label: None, value: none }, { label: Compact, value: compact }, { label: Normal, value: normal }, { label: Roomy, value: roomy }] }
              - &anchor { name: anchor, label: Anchor name (for links like /#name), widget: string, required: false, hint: "Optional. Lower-case, no spaces. Leave blank to use the default." }
              - &animation
                label: Animation
                name: animation
                widget: object
                collapsed: true
                required: false
                hint: "How this block appears as the visitor scrolls. Motion is switched off automatically for visitors who prefer reduced motion."
                fields:
                  - { name: entrance, label: Block entrance, widget: select, default: none, hint: "How the whole block arrives. 'None' lets just the content inside animate.", options: [{ label: None, value: none }, { label: Fade in, value: fade }, { label: Rise up, value: rise }, { label: Slide in from left, value: left }, { label: Slide in from right, value: right }, { label: Zoom in, value: zoom }] }
                  - { name: duration, label: Entrance speed (ms), widget: number, value_type: int, min: 200, max: 3000, step: 100, default: 1000, hint: "Longer is slower. 1000 = one second." }
                  - { name: delay, label: Entrance delay (ms), widget: number, value_type: int, min: 0, max: 2000, step: 100, default: 0 }
                  - { name: headline_words, label: Headline words rise one by one, widget: boolean, default: true }
                  - { name: item_motion, label: Cards and paragraphs appear in turn, widget: boolean, default: true }

          - label: About (text + leaf + facts)
            name: about
            widget: object
            summary: "About: {{heading}}"
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Text, widget: markdown, required: false }
              - { name: plate_label, label: Leaf card label, widget: string, required: false }
              - { name: plate_caption, label: Leaf card caption, widget: text, required: false }
              - { name: leaf, label: Leaf on the card, widget: select, default: draw, options: [{ label: "Draws itself in", value: draw }, { label: "Still (no drawing)", value: static }, { label: "No leaf", value: none }] }
              - { name: facts_label, label: Facts card title, widget: string, required: false }
              - label: Facts
                name: facts
                widget: list
                required: false
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: value, label: Value, widget: string }
              - { name: quote_label, label: Quote card label, widget: string, required: false }
              - { name: quote, label: Quote card text, widget: text, required: false }
              - *spacing
              - &backing { name: backing, label: Text backing panel, widget: select, default: auto, hint: "A soft, semi-transparent panel in the page colour behind the block, so text stays easy to read over the background leaf. Auto turns it on for text-heavy blocks.", options: [{ label: Auto, value: auto }, { label: Always on, value: on }, { label: Off, value: off }] }
              - *anchor
              - *animation

          - label: Process (steps with a drawing line)
            name: process
            widget: object
            summary: "Process: {{heading}}"
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: text, required: false }
              - label: Steps
                name: steps
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text }
              - { name: cta_label, label: Button text, widget: string, required: false }
              - { name: cta_link, label: Button link, widget: string, required: false }
              - { name: rail, label: Line draws across as you scroll, widget: boolean, default: true }
              - *spacing
              - *backing
              - *anchor
              - *animation

          - label: Collection (genetic lines)
            name: collection
            widget: object
            summary: "Collection: {{heading}}"
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: text, required: false }
              - { name: limit, label: How many lines to show (0 = all), widget: number, value_type: int, min: 0, default: 0, hint: "The lines themselves are edited under Site Settings → Genetics Lines." }
              - { name: plate_leaf, label: Faint leaf on each card, widget: boolean, default: true }
              - { name: cta_card, label: Show the closing call-to-action card, widget: boolean, default: true }
              - { name: cta_kicker, label: Card small heading, widget: string, required: false }
              - { name: cta_label, label: Card text, widget: string, required: false }
              - { name: cta_link, label: Card link, widget: string, required: false }
              - *spacing
              - *backing
              - *anchor
              - *animation

          - label: Values (cards with icons)
            name: values
            widget: object
            summary: "Values: {{heading}}"
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: heading, label: Heading, widget: string, required: false }
              - { name: intro, label: Intro text, widget: markdown, required: false }
              - { name: columns, label: Cards per row, widget: select, default: auto, hint: "Auto fits as many as the screen allows. Fixed counts drop to 2, then 1, on smaller screens.", options: [{ label: Auto, value: auto }, { label: "2", value: "2" }, { label: "3", value: "3" }, { label: "4", value: "4" }] }
              - label: Cards
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: icon, label: Icon, widget: select, default: leaf, options: [{ label: "No icon", value: none }, { label: "Leaf", value: leaf }, { label: "Sprout", value: sprout }, { label: "Flask (lab)", value: flask }, { label: "DNA", value: dna }, { label: "Eye", value: eye }, { label: "Hand and heart", value: hand-heart }, { label: "Heart", value: heart }, { label: "Shield (quality)", value: shield-check }, { label: "Sparkles", value: sparkles }, { label: "Scales (balance)", value: scale }, { label: "Compass", value: compass }, { label: "Paintbrush", value: brush }, { label: "Microscope", value: microscope }, { label: "Sun", value: sun }, { label: "Water drops", value: droplets }, { label: "Open book", value: book-open }, { label: "Handshake", value: handshake }, { label: "Scissors", value: scissors }, { label: "Award", value: award }, { label: "Gem", value: gem }, { label: "Feather", value: feather }, { label: "Palette", value: palette }, { label: "Lightbulb", value: lightbulb }, { label: "People", value: users }, { label: "Target", value: target }, { label: "Hourglass", value: hourglass }, { label: "Magnifier", value: search }, { label: "Checklist", value: clipboard-list }, { label: "Camera", value: camera }, { label: "Fingerprint", value: fingerprint }, { label: "Package", value: package }, { label: "Speech bubble", value: message-circle }, { label: "Envelope", value: mail }, { label: "Star", value: star }] }
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Description, widget: text, required: false }
              - *spacing
              - *backing
              - *anchor
              - *animation

          - label: Numbers (count-up stats)
            name: stats
            widget: object
            summary: "Numbers: {{items.0.label}}…"
            fields:
              - label: Numbers
                name: items
                widget: list
                summary: "{{fields.value}}{{fields.suffix}} {{fields.label}}"
                fields:
                  - { name: value, label: Value, widget: number, value_type: int }
                  - { name: suffix, label: Suffix (e.g. +), widget: string, required: false }
                  - { name: label, label: Label, widget: string }
              - { name: count_up, label: Count up from zero when scrolled into view, widget: boolean, default: true }
              - *spacing
              - *backing
              - *anchor
              - *animation

          - label: Insights (latest posts)
            name: insights
            widget: object
            summary: "Insights: {{heading}}"
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: heading, label: Heading, widget: string }
              - { name: count, label: Number of posts, widget: number, value_type: int, min: 1, max: 12, default: 3 }
              - { name: category, label: Only show this category, widget: relation, collection: categories, search_fields: [title], value_field: "{{slug}}", display_fields: [title], required: false, hint: "Leave empty to show the newest from every category." }
              - { name: button_label, label: Button text, widget: string, required: false }
              - *spacing
              - *backing
              - *anchor
              - *animation

          - label: Contact panel
            name: connect
            widget: object
            summary: "Contact: {{heading}}"
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: heading, label: Heading, widget: string, hint: "Wrap a word in <em>…</em> for the italic accent." }
              - { name: show_email, label: Show email, widget: boolean, default: true }
              - { name: show_details, label: Show phone and location, widget: boolean, default: true }
              - { name: show_social, label: Show social links, widget: boolean, default: true }
              - { name: show_instagram, label: Show Instagram feed, widget: boolean, default: true }
              - *spacing
              - *backing
              - *anchor
              - *animation

          - label: Text (heading + body)
            name: text
            widget: object
            summary: "Text: {{heading}}"
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: heading, label: Heading, widget: string, required: false }
              - { name: body, label: Body, widget: markdown, required: false }
              - { name: align, label: Alignment, widget: select, default: left, options: [{ label: Left, value: left }, { label: Centred, value: center }] }
              - *spacing
              - *backing
              - *anchor
              - *animation

          - label: Statement (words light up on scroll)
            name: statement
            widget: object
            summary: "Statement: {{text}}"
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: text, label: Statement, widget: text }
              - *spacing
              - *backing
              - *anchor
              - *animation

          - label: Image
            name: image
            widget: object
            summary: "Image: {{caption}}"
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Description for screen readers, widget: string, required: false, hint: "Leave blank only if the picture is purely decorative." }
              - { name: caption, label: Caption, widget: string, required: false }
              - { name: height, label: Height, widget: select, default: tall, options: [{ label: Short, value: short }, { label: Tall, value: tall }, { label: Full screen, value: screen }] }
              - { name: parallax, label: Image drifts gently as you scroll, widget: boolean, default: true }
              - *spacing
              - *backing
              - *anchor
              - *animation

          - label: Call to action banner
            name: cta
            widget: object
            summary: "Call to action: {{heading}}"
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text, required: false }
              - { name: button_label, label: Button text, widget: string, required: false }
              - { name: button_link, label: Button link, widget: string, required: false }
              - *spacing
              - *backing
              - *anchor
              - *animation

  - name: blog
    label: Insights
    label_singular: Insight
    folder: src/content/blog
    create: true
    extension: md
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Publish Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: description, label: Summary, widget: text, hint: "Shown on the Insights list and in search results." }
      - { name: category, label: Category, widget: relation, collection: categories, search_fields: [title], value_field: "{{slug}}", display_fields: [title], required: false, hint: "Create new categories under Insight Categories." }
      - { name: author, label: Author, widget: relation, collection: people, search_fields: [name], value_field: "{{slug}}", display_fields: [name], required: false, hint: "Shown in the side rail beside the post. Add people under People." }
      - { name: cover, label: Cover Image, widget: image, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft (hide from site), widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }

  - name: people
    label: People
    label_singular: Person
    folder: src/content/people
    format: json
    extension: json
    create: true
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{name}}: {{job_title}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: job_title, label: Title, widget: string, required: false, hint: "e.g. Founder & Head Breeder" }
      - { name: photo, label: Photo, widget: image, required: false, hint: "Portrait works best (4:5). Without a photo, their initials are shown." }
      - { name: bio, label: Short bio, widget: text, required: false, hint: "One to three sentences. Shown in the side rail on their insights." }
      - { name: order, label: Order, widget: number, value_type: int, default: 100, hint: "Lower numbers come first." }

  - name: categories
    label: Insight Categories
    label_singular: Insight Category
    folder: src/content/categories
    format: json
    extension: json
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Category name, widget: string, hint: "e.g. Business Insights, Cultivation, Grow Journal. Each category gets its own page and a filter chip on the Insights page." }
      - { name: description, label: Short description, widget: text, required: false, hint: "Shown at the top of the category page." }
      - { name: order, label: Order, widget: number, value_type: int, default: 100, hint: "Lower numbers come first." }

  - name: settings
    label: Site Settings
    files:
      - name: site
        label: Site Info & Links
        file: src/data/site.json
        fields:
          - { name: name, label: Company Name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: disclaimer, label: Footer Disclaimer, widget: string }
          - label: Contact
            name: contact
            widget: object
            fields:
              - { name: email, label: Email, widget: string, required: false }
              - { name: phone, label: Phone, widget: string, required: false }
              - { name: location, label: Location, widget: string, required: false }
          - { name: social_style, label: Social link style, widget: select, default: icons, hint: "Icons only is the cleanest. Icons with text also shows each name beside its icon.", options: [{ label: "Icons only", value: icons }, { label: "Icons with text", value: icons_text }] }
          - label: Social Links
            name: socials
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "Name (read aloud by screen readers)", widget: string, hint: "Required, even with an icon: e.g. Instagram. It is hidden visually in icons-only mode but is what screen readers announce." }
              - { name: icon, label: Icon, widget: select, default: none, options: [{ label: "None (show the name as text)", value: none }, { label: "Instagram", value: instagram }, { label: "Facebook", value: facebook }, { label: "X (Twitter)", value: x }, { label: "YouTube", value: youtube }, { label: "TikTok", value: tiktok }, { label: "LinkedIn", value: linkedin }, { label: "Pinterest", value: pinterest }, { label: "Threads", value: threads }, { label: "Bluesky", value: bluesky }, { label: "Reddit", value: reddit }, { label: "Discord", value: discord }, { label: "Mastodon", value: mastodon }, { label: "Twitch", value: twitch }, { label: "Spotify", value: spotify }, { label: "SoundCloud", value: soundcloud }, { label: "WhatsApp", value: whatsapp }, { label: "Telegram", value: telegram }, { label: "Snapchat", value: snapchat }, { label: "Vimeo", value: vimeo }, { label: "Etsy", value: etsy }, { label: "Substack", value: substack }, { label: "Patreon", value: patreon }, { label: "GitHub", value: github }, { label: "Email", value: email }, { label: "Website / link", value: website }] }
              - { name: url, label: URL, widget: string }
          - label: Instagram Feed
            name: instagram
            widget: object
            hint: "Create a free feed at behold.so, then paste the Feed ID here."
            fields:
              - { name: handle, label: Instagram Handle (no @), widget: string, required: false }
              - { name: behold_feed_id, label: Behold Feed ID, widget: string, required: false }

      - name: lines
        label: Genetics Lines (Collection)
        file: src/data/lines.json
        fields:
          - label: Lines
            name: lines
            widget: list
            summary: "{{fields.name}} — {{fields.status}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: type, label: Type, widget: string, hint: "e.g. Hybrid, Indica-leaning" }
              - { name: lineage, label: Lineage, widget: string, hint: "Parent A × Parent B" }
              - { name: notes, label: Aroma / Notes, widget: string }
              - { name: status, label: Status, widget: select, options: ["Available", "Limited run", "Coming soon", "Sold out"] }
              - { name: c1, label: Art Colour 1, widget: color }
              - { name: c2, label: Art Colour 2, widget: color }
